name: Numerical tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Node runtime
        run: node --version
      - name: Java analytical and operator tests
        run: bash scripts/test.sh
      - name: JavaScript parity and export tests
        run: bash scripts/test-ios.sh
